[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformers-honeybot"
version = "0.1.0"
description = "Generate and synchronize IaC-derived cyber-deception environments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "watchdog>=3.0",
]

[project.scripts]
honeybot = "transformers_honeybot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
